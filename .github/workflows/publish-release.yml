name: Publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main Build installers run ID
        required: true
        type: string
      tag:
        description: Existing tag and draft release, for example v0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Verify build, attach installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const { mkdirSync, readFileSync, readdirSync, writeFileSync } = require('node:fs')
          const { join } = require('node:path')
          const { BUILD_RUN_ID: runId, RELEASE_TAG: tag, GH_REPO: repo } = process.env
          function check(ok, message) { if (!ok) throw new Error(message) }
          function gh(...args) { return execFileSync('gh', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim() }
          function api(path) { return JSON.parse(gh('api', `repos/${repo}/${path}`)) }

          check(/^[1-9]\d*$/.test(runId) && /^v\d+\.\d+\.\d+$/.test(tag), 'Invalid build run or release tag')
          const run = api(`actions/runs/${runId}`)
          check(run.path === '.github/workflows/build-installers.yml' && run.event === 'workflow_dispatch', 'Expected Build installers run')
          check(run.head_branch === 'main' && run.status === 'completed' && run.conclusion === 'success', 'Build must have succeeded on main')
          check(api(`commits/${tag}`).sha === run.head_sha, 'Release tag does not match the built commit')
          const source = api(`contents/package.json?ref=${run.head_sha}`)
          const version = JSON.parse(Buffer.from(source.content, 'base64').toString('utf8')).version
          check(tag === `v${version}`, 'Release tag and application version differ')
          const draftUrl = JSON.parse(gh('release', 'view', tag, '--json', 'apiUrl')).apiUrl
          const draft = JSON.parse(gh('api', draftUrl))
          check(draft.draft && draft.assets.length === 0, 'Expected an empty draft release')

          const directory = join(process.env.RUNNER_TEMP, 'release-assets')
          mkdirSync(directory, { recursive: true })
          const names = [`InkNest-${version}-win-x64.exe`, `InkNest-${version}-mac-arm64.dmg`]
          for (const name of names) {
            gh('run', 'download', runId, '--name', name.replace(/\.(exe|dmg)$/, ''), '--dir', directory)
          }
          check(JSON.stringify(readdirSync(directory).sort()) === JSON.stringify([...names].sort()), 'Unexpected artifact contents')
          const assets = names.map(name => {
            const bytes = readFileSync(join(directory, name))
            check(bytes.length > 0, `Empty installer: ${name}`)
            return { name, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }
          })
          const sums = assets.map(asset => `${asset.sha256}  ${asset.name}\n`).join('')
          writeFileSync(join(directory, 'SHA256SUMS.txt'), sums)
          assets.push({ name: 'SHA256SUMS.txt', size: Buffer.byteLength(sums), sha256: createHash('sha256').update(sums).digest('hex') })
          gh('release', 'upload', tag, ...assets.map(asset => join(directory, asset.name)))
          const uploaded = api(`releases/${draft.id}`).assets
          check(uploaded.length === assets.length, 'Unexpected release assets')
          for (const expected of assets) {
            const asset = uploaded.find(asset => asset.name === expected.name)
            check(asset && asset.state === 'uploaded' && asset.size === expected.size && asset.digest === `sha256:${expected.sha256}`, `Uploaded asset verification failed: ${expected.name}`)
          }
          gh('release', 'edit', tag, '--draft=false', '--latest', '--verify-tag')
          console.log(gh('release', 'view', tag, '--json', 'url,isDraft,tagName'))
          JS
